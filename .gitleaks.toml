# Gitleaks configuration for Hifth.
#
# Extends the built-in ruleset (AWS keys, GitHub/GitLab tokens, private keys,
# generic high-entropy secrets, etc.) and adds a narrow allowlist so the mushaf
# SVG geometry — long strings of numbers in polygon/path coordinates — is not
# flagged as a high-entropy secret. Everything else stays on the default rules.
#
# Run locally:   make secrets-staged    (what is about to be committed)
#                make secrets-history   (every commit in history)
#                make secrets           (history plus the files on disk)
# The pre-commit hook runs the first, the pre-push hook the second; a missing
# gitleaks fails both. scripts/secrets-staged.test.mjs proves a staged private
# key is refused. GitHub's own secret scanning and push blocking are also on
# for the repo (turned on 2026-11-09), as a second net behind these.

title = "Hifth gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Mushaf SVG assets are glyph geometry (numeric path data), not secrets."
paths = [
  '''apps/web/public/assets/pages/.*\.svg''',
  # The interactive design-phase mock embeds the same SVG geometry inline.
  '''docs/reference/linker-mock\.html''',
  # Lockfile integrity hashes are not secrets.
  '''pnpm-lock\.yaml''',
]
# The names the app keeps a reader's choices under on the device
# ("hifth.jump.arrows.v1") sit after a constant called *_KEY, which the generic
# key rule reads as a secret. A name of that exact shape never is one.
regexes = [
  '''^hifth\.[a-z0-9.-]+\.v[0-9]+$''',
]
