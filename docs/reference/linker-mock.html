<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linker رابط — hop navigator for huffaz (mock)</title>
<style>
:root{
  --binding:#0E3A2C; --binding2:#175641; --binding3:#0A2B20;
  --gilt:#C2A14D; --gilt2:#E7CE86; --gilt3:#8f7433;
  --paper:#FBF8F1; --ink:#221D15; --inksoft:#5c5546;
  --sel:#F5E6A3; --crumb:#8FB3A4;
  --d1:#B4433A; --d2:#25756D;
  --rail-bg:#0c3226f2;
  --ar:"Scheherazade New","Amiri","Noto Naskh Arabic","Traditional Arabic",Georgia,serif;
  --ui:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui); color:var(--paper); background:
    radial-gradient(1200px 700px at 50% -10%, #1b6a50 0%, transparent 60%),
    linear-gradient(160deg,var(--binding2),var(--binding) 45%,var(--binding3));
  display:flex; flex-direction:column; overflow:hidden;
}
/* ---------- top bar ---------- */
header{
  display:flex; align-items:center; gap:14px; padding:10px 16px;
  border-bottom:1px solid #ffffff22;
  background:linear-gradient(180deg,#ffffff10,transparent);
  flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px}
.brand .ar{font-family:var(--ar); font-size:30px; line-height:1; color:var(--gilt2)}
.brand .lat{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#cfe3da}
.brand .lat b{color:var(--gilt2); font-weight:600}
.edition{
  font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#bcd6cb;
  border:1px solid #ffffff2e; border-radius:999px; padding:5px 12px;
}
.spacer{flex:1}
.toggle{
  display:flex; border:1px solid var(--gilt3); border-radius:999px; overflow:hidden;
  font-size:11px; letter-spacing:.08em;
}
.toggle button{
  background:transparent; color:#d8e6df; border:0; padding:6px 14px; cursor:pointer;
  font-family:var(--ui); font-size:11px; letter-spacing:.08em;
}
.toggle button.on{background:var(--gilt); color:#22200f; font-weight:600}
.btn{
  background:transparent; color:var(--gilt2); border:1px solid var(--gilt3);
  border-radius:999px; padding:6px 14px; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; cursor:pointer; font-family:var(--ui);
}
.btn:hover{background:#ffffff14}
/* ---------- stage ---------- */
#stage{position:relative; flex:1; overflow:hidden; cursor:grab; touch-action:none}
#stage.dragging{cursor:grabbing}
#zoomwrap{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
.pagemat{
  position:relative; background:var(--paper); border-radius:6px;
  box-shadow:0 30px 60px -20px #00000090, 0 0 0 1px #d9c893, 0 0 0 5px var(--paper), 0 0 0 6px #c2a14d66;
}
.pagemat svg{display:block; width:100%; height:100%}
.pagemat .pageno{
  position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
  color:#ffffffc9; font-size:11px; letter-spacing:.3em;
}
/* placeholder page for out-of-bundle targets */
.ghostpage{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; color:var(--inksoft); text-align:center; padding:30px; height:100%;
  font-family:var(--ui);
}
.ghostpage .big{font-family:var(--ar); font-size:64px; color:#b9ab8c}
.ghostpage p{font-size:12px; max-width:230px; line-height:1.6}
.ghostpage .key{font-size:15px; color:var(--ink); font-weight:600}
/* ---------- polygons (runtime styling only — assets untouched) ---------- */
.ayahPolygon{fill-opacity:0; cursor:pointer; transition:fill-opacity .15s}
.ayahPolygon:hover{fill:var(--sel); fill-opacity:.35}
.ayahPolygon.sel{fill:var(--sel); fill-opacity:.6}
.ayahPolygon.crumb{fill:var(--crumb); fill-opacity:.28}
.ayahPolygon.hlt{fill:#F7C143; fill-opacity:.5}
.ayahPolygon.pulse{animation:pulseFill 1.5s ease-out 2}
@keyframes pulseFill{0%{fill:var(--gilt);fill-opacity:.75}100%{fill:var(--sel);fill-opacity:.55}}
@media (prefers-reduced-motion:reduce){.ayahPolygon.pulse{animation:none;fill:var(--sel);fill-opacity:.6}}
/* simulated tajweed skin — class injection demo */
body.skin-taj .glyphs .tj1{fill:#b32f22}
body.skin-taj .glyphs .tj2{fill:#1e7a34}
body.skin-taj .glyphs .tj3{fill:#1c5f9e}
body.skin-taj .glyphs .tj4{fill:#8a8a8a}
/* ---------- page turn ---------- */
.turn{
  position:absolute; top:50%; transform:translateY(-50%); z-index:5;
  background:var(--rail-bg); color:var(--gilt2); border:1px solid var(--gilt3);
  border-radius:10px; padding:14px 10px; cursor:pointer; font-size:15px;
  font-family:var(--ui); backdrop-filter:blur(4px);
}
.turn small{display:block; font-size:9px; letter-spacing:.2em; color:#bcd6cb; margin-top:4px}
.turn:disabled{opacity:.3; cursor:default}
#turnL{left:10px} #turnR{right:10px}
/* ---------- hop rail (signature) ---------- */
#rail{
  position:absolute; z-index:6; display:none; flex-direction:column; gap:6px;
  background:var(--rail-bg); border:1px solid var(--gilt3); border-radius:14px;
  padding:8px; backdrop-filter:blur(6px);
  box-shadow:0 12px 30px -10px #000c;
}
#rail.show{display:flex}
.chip{
  display:flex; align-items:center; gap:8px; border:0; background:transparent;
  color:#e8f1ec; cursor:pointer; padding:6px 8px; border-radius:9px;
  font-family:var(--ui); font-size:12px; text-align:left; white-space:nowrap;
}
.chip:hover{background:#ffffff16}
.chip .ic{
  width:24px;height:24px;border-radius:50%; display:grid; place-items:center;
  background:var(--gilt); color:#221d0d; font-size:12px; font-weight:700; flex:none;
}
.chip .ic svg{display:block}
.ic.mir svg{transform:scaleX(-1)}
#ctx{
  position:absolute; z-index:9; display:none; flex-direction:column; gap:2px;
  background:var(--rail-bg); border:1px solid var(--gilt3); border-radius:12px;
  padding:6px; backdrop-filter:blur(6px); box-shadow:0 14px 34px -10px #000d;
}
#ctx.show{display:flex}
#ctx .chdr{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#9fc0b4;padding:4px 10px 4px}
.chip .ct{font-size:10px; color:var(--gilt2); letter-spacing:.05em}
.chip.reserved{opacity:.38; cursor:default}
.chip.reserved .ic{background:#5b6f67; color:#0c1f18}
.chip.reserved:hover{background:transparent}
.railhdr{font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:#9fc0b4; padding:0 8px 2px}
/* ---------- popover / hop panel ---------- */
#panel{
  position:absolute; z-index:8; right:14px; top:14px; width:min(360px, calc(100% - 28px));
  max-height:calc(100% - 28px); overflow:auto;
  background:#fdfaf3; color:var(--ink); border-radius:14px; display:none;
  box-shadow:0 30px 60px -18px #000000c9, 0 0 0 1px #c2a14d66;
}
#panel.show{display:block}
.phdr{
  position:sticky; top:0; display:flex; align-items:center; gap:10px;
  background:linear-gradient(180deg,#f4ecd7,#fdfaf3); padding:12px 14px;
  border-bottom:1px solid #e2d5ae;
}
.phdr .t{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#6b6047; flex:1}
.phdr .x{border:0;background:transparent;font-size:16px;cursor:pointer;color:#6b6047}
.hop{border-bottom:1px solid #eee4c8; padding:12px 14px}
.hop:last-child{border-bottom:0}
.hoptop{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.hkey{font-weight:700; font-size:14px}
.tag{font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:999px}
.tag.dir{background:#e8f0ea; color:#20614c}
.tag.ext{background:#f6e3e0; color:#8c3a31}
.tag.same{background:#efe7cf; color:#7a651f}
.tag.tw{background:#e4ecf5; color:#2b567f}
.diff{direction:rtl; font-family:var(--ar); font-size:21px; line-height:2.1; color:var(--ink)}
.diff .who{
  direction:ltr; font-family:var(--ui); font-size:9px; letter-spacing:.18em;
  text-transform:uppercase; color:#9a8d6d; display:block; line-height:1; margin:6px 0 0;
}
.diff .d1{color:var(--d1); background:#b4433a14; border-radius:4px}
.diff .d2{color:var(--d2); background:#25756d14; border-radius:4px}
.hopgo{
  margin-top:10px; background:var(--binding2); color:#fff; border:0; border-radius:8px;
  padding:8px 16px; font-size:11px; letter-spacing:.15em; text-transform:uppercase; cursor:pointer;
}
.hopgo:hover{background:var(--binding)}
.hopnote{font-size:11px; color:#8a7d5c; margin-top:8px; line-height:1.5}
/* ---------- footer: subha bead trail ---------- */
footer{
  display:flex; align-items:center; gap:14px; padding:10px 16px 12px;
  border-top:1px solid #ffffff22; min-height:58px;
}
.trailhdr{font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:#9fc0b4; flex:none}
#beads{display:flex; align-items:center; overflow-x:auto; flex:1; padding:6px 2px}
.cord{width:26px; height:2px; background:linear-gradient(90deg,var(--gilt3),var(--gilt)); flex:none}
.bead{
  flex:none; border:0; cursor:pointer; border-radius:999px; padding:6px 12px;
  background:radial-gradient(circle at 30% 30%, var(--gilt2), var(--gilt) 60%, var(--gilt3));
  color:#241d09; font-weight:700; font-size:12px; font-family:var(--ui);
  box-shadow:0 3px 8px -2px #000a, inset 0 1px 0 #fff8;
}
.bead.here{outline:2px solid #fff; outline-offset:2px}
.tassel{font-family:var(--ar); color:var(--gilt2); font-size:18px; flex:none; margin-right:2px}
#trailshare{flex:none}
.hint{
  position:absolute; z-index:4; left:50%; top:18px; transform:translateX(-50%);
  background:var(--rail-bg); border:1px solid var(--gilt3); color:#e8f1ec;
  padding:8px 16px; border-radius:999px; font-size:12px; letter-spacing:.05em;
  transition:opacity .6s;
}
/* ---------- toast / share ---------- */
#toast{
  position:fixed; z-index:20; bottom:76px; left:50%; transform:translateX(-50%);
  background:#171512; color:#f3ecd9; border:1px solid var(--gilt3); border-radius:10px;
  padding:10px 14px; font-size:12px; display:none; max-width:min(560px,90vw);
}
#toast.show{display:block}
#toast code{font-size:11px; color:var(--gilt2); word-break:break-all; display:block; margin-top:4px}
@media (max-width:720px){
  #panel{right:8px; left:8px; width:auto; top:auto; bottom:8px; max-height:60%}
  .brand .lat{display:none}
}
</style>
</head>
<body class="skin-plain">

<header>
  <div class="brand">
    <span class="ar">رَابِط</span>
    <span class="lat"><b>Linker</b> · hop navigator · mock</span>
  </div>
  <span class="edition" id="editionTag">Hafs · KFQC · demo bundle p7 · p9 · p19</span>
  <div class="spacer"></div>
  <div class="toggle" role="group" aria-label="Skin">
    <button id="skinPlain" class="on">Plain</button>
    <button id="skinTaj" title="Simulated — real mapping comes from the tajweed rule ETL (spec §8)">Tajweed*</button>
  </div>
  <button class="btn" id="shareBtn">Share link</button>
</header>

<div id="stage">
  <div class="hint" id="hint">Tap an ayah, or drag across the text to highlight a passage — then hop</div>
  <button class="turn" id="turnR">‹<small id="turnRlab"></small></button>
  <button class="turn" id="turnL">›<small id="turnLlab"></small></button>
  <div id="zoomwrap"></div>

  <div id="rail" role="menu"></div>
  <div id="ctx" role="menu"></div>

  <div id="panel">
    <div class="phdr"><span class="t" id="panelTitle"></span><button class="x" id="panelClose">✕</button></div>
    <div id="panelBody"></div>
  </div>
</div>

<footer>
  <span class="trailhdr">Hop trail</span>
  <span class="tassel">﴿</span>
  <div id="beads"></div>
  <button class="btn" id="trailshare" title="Share this whole chain as one link">Share trail</button>
</footer>

<div id="toast"></div>

/* =====================================================================
   L2 — HIGHLIGHTER. Only this object touches SVG internals.
   ===================================================================== */
const stage = document.getElementById('stage');
const zoomwrap = document.getElementById('zoomwrap');

const HL = (() => {
  let curPage = null, matEl = null, matW = 0, matH = 0;
  let z = 1, tx = 0, ty = 0;
  const listeners = [];
  const groups = { selection:[], crumb:[] };

  function fit(){
    const sw = stage.clientWidth, sh = stage.clientHeight;
    matH = Math.min(sh - 46, (sw - 90) * VB.h / VB.w);
    matW = matH * VB.w / VB.h;
    if (matEl){ matEl.style.width = matW+'px'; matEl.style.height = matH+'px'; }
    z = 1; tx = (sw - matW)/2; ty = (sh - matH)/2 - 6;
    apply();
  }
  function apply(){
    zoomwrap.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
    positionRail();
  }
  function loadPage(p){
    if (curPage === p) return true;
    zoomwrap.innerHTML = '';
    matEl = document.createElement('div');
    matEl.className = 'pagemat';
    const tpl = document.getElementById('tpl-p'+p);
    if (tpl){                                    // real asset
      matEl.innerHTML = tpl.innerHTML;
      const svg = matEl.querySelector('svg');
      svg.removeAttribute('width'); svg.removeAttribute('height');
      // glyphs must not eat clicks (asset README rule)
      svg.querySelectorAll('path:not(.ayahPolygon)').forEach((el,i)=>{
        el.style.pointerEvents='none';
        el.classList.add('tj'+((i%9===0)?1:(i%9===3)?2:(i%9===6)?3:(i%9===8)?4:0)); // simulated skin classes
      });
      svg.classList.add('glyphs');
      svg.querySelectorAll('.ayahPolygon').forEach(poly=>{
        poly.addEventListener('click', e=>{
          e.stopPropagation();
          if (suppressClick){ suppressClick=false; return; }
          const key = poly.getAttribute('surah')+':'+poly.getAttribute('ayah');
          listeners.forEach(cb=>cb(key,'ayah'));
        });
      });
    } else {                                     // out-of-bundle placeholder
      matEl.innerHTML = `<div class="ghostpage">
        <div class="big">﴾ ${p} ﴿</div>
        <div class="key" id="ghostkey"></div>
        <p>This page is outside the three-page demo bundle. In the full build the
        highlighter streams it from the same asset corpus and this hop lands with
        the shared phrase pulsing.</p></div>`;
    }
    const lab=document.createElement('div'); lab.className='pageno';
    lab.textContent = tpl ? `PAGE ${p} · MADANI MUSHAF` : `PAGE ${p} · NOT IN DEMO BUNDLE`;
    matEl.appendChild(lab);
    zoomwrap.appendChild(matEl);
    curPage = p; fit(); updateTurns();
    return !!tpl;
  }
  function polyFor(key){
    if (!matEl) return null;
    const [s,a] = key.split(':');
    return matEl.querySelector(`.ayahPolygon[surah="${s}"][ayah="${a}"]`);
  }
  function resolve(key){
    const poly = polyFor(key); if (!poly) return null;
    const b = poly.getBBox();
    return { page:curPage, bbox:b };
  }
  function highlight(key, style, group){
    const poly = polyFor(key); if (!poly) return;
    poly.classList.add(style);
    (groups[group] = groups[group]||[]).push(poly);
  }
  function clear(group){
    (groups[group]||[]).forEach(p=>p.classList.remove('sel','crumb','pulse'));
    groups[group]=[];
  }
  function focus(b, zoom=1.55){
    const s = matW / VB.w;
    const cx = (b.x + b.width/2) * s, cy = (b.y + b.height/2) * s;
    z = zoom;
    tx = stage.clientWidth/2 - z*cx; ty = stage.clientHeight/2 - z*cy;
    apply();
  }
  async function navigateTo(key, page, opts={}){
    const inBundle = loadPage(page);
    if (!inBundle){
      const gk = matEl.querySelector('#ghostkey'); if (gk) gk.textContent = key;
      return { external:true };
    }
    const r = resolve(key);
    if (r){
      focus(r.bbox, opts.zoom ?? 1.55);
      if (opts.pulse !== false){
        const poly = polyFor(key);
        poly.classList.remove('pulse'); void poly.getBBox(); poly.classList.add('pulse');
      }
    }
    return { external:false, resolved:r };
  }
  function setSkin(name){
    document.body.classList.toggle('skin-taj', name==='taj');
    document.body.classList.toggle('skin-plain', name==='plain');
  }
  /* --- drag semantics: start ON text = highlight-select; start elsewhere = pan --- */
  let drag=null, selDrag=null, suppressClick=false;
  const rangeCbs=[];
  function svgPoint(e){
    const svg=matEl && matEl.querySelector('svg'); if(!svg) return null;
    const pt=new DOMPoint(e.clientX,e.clientY);
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function rangeUnder(a,b){
    const x1=Math.min(a.x,b.x), x2=Math.max(a.x,b.x);
    const y1=Math.min(a.y,b.y), y2=Math.max(a.y,b.y);
    const out=[];
    matEl.querySelectorAll('.ayahPolygon').forEach(p=>{
      const r=p.getBBox();
      if (r.x < x2 && r.x+r.width > x1 && r.y < y2 && r.y+r.height > y1)
        out.push(p.getAttribute('surah')+':'+p.getAttribute('ayah'));
    });
    return out;
  }
  stage.addEventListener('pointerdown',e=>{
    if (e.target.closest('#rail,#panel,#ctx,.turn')) return;
    if (e.target.classList && e.target.classList.contains('ayahPolygon')){
      selDrag={start:svgPoint(e), moved:false};            // pen down on the text
    } else {
      drag={x:e.clientX,y:e.clientY,tx,ty}; stage.classList.add('dragging');
    }
  });
  window.addEventListener('pointermove',e=>{
    if (selDrag && selDrag.start){
      const p=svgPoint(e); if(!p) return;
      if (!selDrag.moved && Math.hypot(p.x-selDrag.start.x,p.y-selDrag.start.y) > 3) selDrag.moved=true;
      if (selDrag.moved){
        clear('hlt');
        rangeUnder(selDrag.start,p).forEach(k=>highlight(k,'hlt','hlt'));
        selDrag.keys = rangeUnder(selDrag.start,p);
        selDrag.at = {x:e.clientX,y:e.clientY};
      }
      return;
    }
    if(!drag) return;
    tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y); apply();
  });
  window.addEventListener('pointerup',()=>{
    if (selDrag){
      if (selDrag.moved && selDrag.keys && selDrag.keys.length){
        suppressClick=true;                                 // don't fire ayah click too
        rangeCbs.forEach(cb=>cb(selDrag.keys, selDrag.at));
      }
      selDrag=null;
    }
    drag=null; stage.classList.remove('dragging');
  });
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    const f = e.deltaY<0 ? 1.12 : 1/1.12;
    const nz = Math.min(4, Math.max(.6, z*f));
    const rx=e.clientX - stage.getBoundingClientRect().left;
    const ry=e.clientY - stage.getBoundingClientRect().top;
    tx = rx - (rx-tx)*(nz/z); ty = ry - (ry-ty)*(nz/z); z=nz; apply();
  },{passive:false});
  window.addEventListener('resize',fit);

  return { loadPage, resolve, highlight, clear, navigateTo, setSkin,
           onSelect:cb=>listeners.push(cb),
           onRangeSelect:cb=>rangeCbs.push(cb),
           get page(){return curPage},
           toScreen(b){ const s=matW/VB.w;
             return { x: tx + z*b.x*s, y: ty + z*b.y*s, w: z*b.width*s, h: z*b.height*s }; } };
})();

/* =====================================================================
   L3 — CONTROLLER: hop rail, popovers, trail, share links.
   ===================================================================== */
const rail = document.getElementById('rail');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const panelTitle = document.getElementById('panelTitle');
let SEL = null, VIA = null, TRAIL = [];

function bucketsFor(key){
  const [s,a] = key.split(':').map(Number);
  const edges = (ADJ[key]?.edges)||[];
  const B = { same:[], earlier:[], later:[], root:[], related:[] };
  for (const e of edges){
    if (e.type==='root'){ B.root.push(e); continue; }
    if (e.type==='related'){ B.related.push(e); continue; }
    const [ts] = e.to.split(':').map(Number);
    (ts===s ? B.same : ts<s ? B.earlier : B.later).push(e);
  }
  return B;
}
function positionRail(){
  if (!SEL || !rail.classList.contains('show')) return;
  const r = HL.resolve(SEL); if (!r){ rail.classList.remove('show'); return; }
  const sc = HL.toScreen(r.bbox);
  let x = sc.x - rail.offsetWidth - 12;               // RTL: verse "end" side
  if (x < 8) x = Math.min(stage.clientWidth - rail.offsetWidth - 8, sc.x + sc.w + 12);
  let y = sc.y + sc.h/2 - rail.offsetHeight/2;
  y = Math.max(8, Math.min(stage.clientHeight - rail.offsetHeight - 8, y));
  rail.style.left = x+'px'; rail.style.top = y+'px';
}
function chip(ic, label, count, onClick, cls='', mirror=false){
  const b=document.createElement('button');
  b.className='chip '+cls; b.role='menuitem';
  b.innerHTML=`<span class="ic${mirror?' mir':''}">${ic}</span><span>${label}</span>`+(count?` <span class="ct">${count}</span>`:'');
  if (onClick) b.addEventListener('click',onClick);
  return b;
}
function showRail(key){
  const B = bucketsFor(key);
  rail.innerHTML = `<div class="railhdr">${key} — hops</div>`;
  if (B.same.length)    rail.appendChild(chip(HOP_LOOP,'Same surah',B.same.length,()=>openPanel(key,'Same surah — similar wording',B.same)));
  if (B.earlier.length) rail.appendChild(chip(HOP_IC,'Earlier surahs',B.earlier.length,()=>openPanel(key,'Earlier surahs',B.earlier),'', true));
  if (B.later.length)   rail.appendChild(chip(HOP_IC,'Later surahs',B.later.length,()=>openPanel(key,'Later surahs — similar wording',B.later)));
  if (B.root.length){
    const root = B.root[0].root, occ = ROOTS[root]||[];
    rail.appendChild(chip('⬡',`Root ${root}`,occ.length,()=>openRootPanel(key,root,occ)));
  }
  if (B.related.length) rail.appendChild(chip('≈','Related meaning',B.related.length,()=>openPanel(key,'Related in meaning (secondary)',B.related)));
  REGISTRY.filter(r=>r.status==='reserved').forEach(r=>{
    const c = chip(r.ic, r.label, '', null, 'reserved');
    c.title = 'Reserved edge type — placeholder (spec §5, Phase 6). Activates with a data drop; no UI change.';
    rail.appendChild(c);
  });
  rail.classList.add('show'); positionRail();
}
function diffHTML(key, cls){
  const toks = T[key]; if (!toks) return '';
  const spans = toks.map(([t,d])=> d? `<span class="d${d}">${t}</span>` : t).join(' ');
  return `<div class="diff">${spans}<span class="who">${cls||key}</span></div>`;
}
function openPanel(fromKey, title, edges){
  panelTitle.textContent = title;
  panelBody.innerHTML = '';
  edges.forEach(e=>{
    const inBundle = BUNDLE.includes(e.page);
    const el = document.createElement('div'); el.className='hop';
    el.innerHTML = `
      <div class="hoptop">
        <span class="hkey">→ ${e.to}</span>
        <span class="tag dir">page ${e.page}</span>
        ${e.twin?'<span class="tag tw">identical twin</span>':''}
        ${inBundle?'':'<span class="tag ext">outside demo bundle</span>'}
      </div>
      ${diffHTML(fromKey, fromKey+' — here')}
      ${diffHTML(e.to, e.to+' — target')}
      ${e.note?`<div class="hopnote">${e.note}${e.ctx?' · popover would also show the following ayah (ctx flag)':''}</div>`:''}
    `;
    const go=document.createElement('button'); go.className='hopgo';
    go.innerHTML = (inBundle ? 'Hop there ' : 'Hop (placeholder page) ')+HOP_IC;
    go.addEventListener('click',()=>doHop(fromKey,e));
    el.appendChild(go);
    panelBody.appendChild(el);
  });
  panel.classList.add('show');
}
function openRootPanel(fromKey, root, occ){
  panelTitle.textContent = `Root ${root} — occurrences`;
  panelBody.innerHTML = `<div class="hop"><div class="hopnote">Word-level spans need the
    ligature corpus (spec §4); this ayah-polygon asset demos at ayah level. Sorted by page
    distance — nearest first, the hafiz-useful ordering.</div></div>`;
  occ.filter(o=>o.key!==fromKey)
     .sort((a,b)=>Math.abs(a.page-(HL.page||0))-Math.abs(b.page-(HL.page||0)))
     .forEach(o=>{
    const inBundle = BUNDLE.includes(o.page);
    const el=document.createElement('div'); el.className='hop';
    el.innerHTML=`<div class="hoptop"><span class="hkey">→ ${o.key}</span>
      <span class="tag dir">page ${o.page}</span>
      ${inBundle?'':'<span class="tag ext">outside demo bundle</span>'}</div>
      ${diffHTML(o.key)}`;
    const go=document.createElement('button'); go.className='hopgo';
    go.innerHTML = (inBundle?'Hop there ':'Hop (placeholder page) ')+HOP_IC;
    go.addEventListener('click',()=>doHop(fromKey,{to:o.key,page:o.page}));
    el.appendChild(go);
    panelBody.appendChild(el);
  });
  panel.classList.add('show');
}
async function doHop(fromKey, edge){
  panel.classList.remove('show');
  VIA = fromKey;
  pushBead(fromKey);
  await select(edge.to, edge.page, {pulse:true});
}
/* ---------- selection ---------- */
async function select(key, page, opts={}){
  HL.clear('selection');
  const res = await HL.navigateTo(key, page, opts);
  SEL = key;
  if (!res.external){
    HL.highlight(key,'sel','selection');
    if (VIA){ HL.clear('crumb'); HL.highlight(VIA,'crumb','crumb'); }
    showRail(key);
  } else {
    rail.classList.remove('show');
  }
  pushBead(key, true);
  setHash();
  document.getElementById('hint').style.opacity = 0;
}
/* ---------- subha bead trail ---------- */
const beadsEl = document.getElementById('beads');
function pushBead(key, here=false){
  if (TRAIL[TRAIL.length-1] !== key) TRAIL.push(key);
  beadsEl.innerHTML='';
  TRAIL.forEach((k,i)=>{
    if (i) { const c=document.createElement('span'); c.className='cord'; beadsEl.appendChild(c); }
    const b=document.createElement('button'); b.className='bead'+(k===SEL?' here':''); b.textContent=k;
    b.title='Hop back to '+k;
    b.addEventListener('click',()=>{ VIA=null; const pg=findPage(k); if(pg) select(k,pg,{pulse:true}); });
    beadsEl.appendChild(b);
  });
  beadsEl.scrollLeft = beadsEl.scrollWidth;
}
function findPage(key){
  const [s,a]=key.split(':');
  for (const p of BUNDLE){
    const tpl=document.getElementById('tpl-p'+p);
    if (tpl && new RegExp(`ayah="${a}"[^>]*surah="${s}"|surah="${s}"[^>]*ayah="${a}"`).test(tpl.innerHTML)) return p;
  }
  const e=Object.values(ADJ).flatMap(x=>x.edges).find(x=>x.to===key);
  return e?e.page:null;
}
/* ---------- page turns (RTL: next page flips leftward) ---------- */
const turnL=document.getElementById('turnL'), turnR=document.getElementById('turnR');
function updateTurns(){
  const i=BUNDLE.indexOf(HL.page);
  const next=BUNDLE[i+1], prev=BUNDLE[i-1];
  turnL.disabled = next==null; turnR.disabled = prev==null;
  document.getElementById('turnLlab').textContent = next!=null?('p'+next):'';
  document.getElementById('turnRlab').textContent = prev!=null?('p'+prev):'';
  turnL.onclick=()=>{ if(next!=null){rail.classList.remove('show'); HL.loadPage(next); setHash();} };
  turnR.onclick=()=>{ if(prev!=null){rail.classList.remove('show'); HL.loadPage(prev); setHash();} };
}
window.addEventListener('keydown',e=>{
  if (e.key==='ArrowLeft') turnL.click();
  if (e.key==='ArrowRight') turnR.click();
  if (e.key==='Escape'){ panel.classList.remove('show'); }
});
/* ---------- share links (spec §7) ---------- */
function curHash(withTrail=false){
  if (!SEL) return `#/${EDITION}/p${HL.page}`;
  let h = `#/${EDITION}/${SEL}`;
  const q=[];
  if (VIA) q.push('via='+VIA);
  if (document.body.classList.contains('skin-taj')) q.push('skin=tajweed');
  if (withTrail && TRAIL.length>1) q.push('trail='+TRAIL.join(','));
  return h + (q.length?'?'+q.join('&'):'');
}
function setHash(){ history.replaceState(null,'',curHash()); }
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 5200);
}
document.getElementById('shareBtn').addEventListener('click',()=>{
  const url = location.origin+location.pathname+curHash();
  navigator.clipboard?.writeText(url).catch(()=>{});
  toast('Anchor link (copied if permitted) — recipient lands exactly here, breadcrumb included:<code>'+curHash()+'</code>');
});
document.getElementById('trailshare').addEventListener('click',()=>{
  const h=curHash(true);
  navigator.clipboard?.writeText(location.origin+location.pathname+h).catch(()=>{});
  toast('Trail link — a teacher can send this whole confusion-cluster walk as one URL:<code>'+h+'</code>');
});
/* ---------- skin toggle (spec §8) ---------- */
const bPlain=document.getElementById('skinPlain'), bTaj=document.getElementById('skinTaj');
bPlain.addEventListener('click',()=>{HL.setSkin('plain'); bPlain.classList.add('on'); bTaj.classList.remove('on'); setHash();});
bTaj.addEventListener('click',()=>{
  HL.setSkin('taj'); bTaj.classList.add('on'); bPlain.classList.remove('on'); setHash();
  toast('Simulated tajweed skin — classes injected onto existing glyph paths at runtime. Real color mapping comes from the tajweed-rule ETL (spec §8); geometry and hit-polygons are identical in both skins.');
});
/* ---------- post-highlight context menu (drag a passage, then hop) ---------- */
const ctx = document.getElementById('ctx');
let RSEL = null;
function mergedEdges(keys){
  const seen=new Set(), out=[];
  keys.forEach(k=>(ADJ[k]?.edges||[]).forEach(e=>{
    if (e.type==='root') return;
    const id=k+'>'+e.to; if(seen.has(id)) return; seen.add(id);
    out.push({from:k, ...e});
  }));
  return out;
}
function showCtx(keys, at){
  RSEL = keys;
  const label = keys.length>1 ? keys[0]+' – '+keys[keys.length-1] : keys[0];
  const edges = mergedEdges(keys);
  const roots = keys.filter(k=>(ADJ[k]?.edges||[]).some(e=>e.type==='root'));
  ctx.innerHTML = `<div class="chdr">Highlighted · ${label}</div>`;
  if (edges.length)
    ctx.appendChild(chip(HOP_IC, 'Hop to similar verses', edges.length, ()=>{
      ctx.classList.remove('show');
      openRangePanel(label, edges);
    }));
  if (roots.length)
    ctx.appendChild(chip('⬡','Root lens', roots.length, ()=>{
      ctx.classList.remove('show');
      const k=roots[0]; const e=(ADJ[k].edges).find(x=>x.type==='root');
      openRootPanel(k, e.root, ROOTS[e.root]||[]);
    }));
  ctx.appendChild(chip('🔗','Copy anchor link','',()=>{
    const hsh = `#/${EDITION}/${keys.length>1?keys[0]+'-'+keys[keys.length-1]:keys[0]}`;
    navigator.clipboard?.writeText(location.origin+location.pathname+hsh).catch(()=>{});
    toast('Range anchor link:<code>'+hsh+'</code>');
    ctx.classList.remove('show');
  }));
  ctx.appendChild(chip('✕','Clear highlight','',()=>{
    HL.clear('hlt'); RSEL=null; ctx.classList.remove('show');
  }));
  const sr = stage.getBoundingClientRect();
  let x = at.x - sr.left + 10, y = at.y - sr.top + 10;
  ctx.classList.add('show');
  x = Math.min(x, stage.clientWidth - ctx.offsetWidth - 8);
  y = Math.min(y, stage.clientHeight - ctx.offsetHeight - 8);
  ctx.style.left = Math.max(8,x)+'px'; ctx.style.top = Math.max(8,y)+'px';
}
function openRangePanel(label, edges){
  panelTitle.textContent = 'Similar to highlighted · '+label;
  panelBody.innerHTML = '';
  edges.forEach(e=>{
    const inBundle = BUNDLE.includes(e.page);
    const el = document.createElement('div'); el.className='hop';
    el.innerHTML = `
      <div class="hoptop">
        <span class="hkey">${e.from} → ${e.to}</span>
        <span class="tag dir">page ${e.page}</span>
        ${e.twin?'<span class="tag tw">identical twin</span>':''}
        ${inBundle?'':'<span class="tag ext">outside demo bundle</span>'}
      </div>
      ${diffHTML(e.from, e.from+' — highlighted')}
      ${diffHTML(e.to, e.to+' — target')}
      ${e.note?`<div class="hopnote">${e.note}</div>`:''}`;
    const go=document.createElement('button'); go.className='hopgo';
    go.innerHTML=(inBundle?'Hop there ':'Hop (placeholder page) ')+HOP_IC;
    go.addEventListener('click',()=>{ HL.clear('hlt'); doHop(e.from, e); });
    el.appendChild(go);
    panelBody.appendChild(el);
  });
  panel.classList.add('show');
}
HL.onRangeSelect((keys, at)=>{
  rail.classList.remove('show');
  showCtx(keys, at);
  document.getElementById('hint').style.opacity = 0;
});

/* ---------- wire up ---------- */
document.getElementById('panelClose').addEventListener('click',()=>panel.classList.remove('show'));
HL.onSelect((key)=>{ VIA=null; HL.clear('crumb'); HL.clear('hlt'); ctx.classList.remove('show'); select(key, HL.page, {pulse:false}); });

/* ---------- boot: parse anchor link or default ---------- */
(function boot(){
  const m = location.hash.match(/^#\/([\w-]+)\/(\d+:\d+)(?:-(\d+:\d+))?(?:\?(.*))?$/);
  HL.loadPage(7);
  if (m){
    const q = new URLSearchParams(m[4]||'');
    if (q.get('skin')==='tajweed') bTaj.click();
    const via=q.get('via'); if (via) VIA=via;
    const trail=q.get('trail'); if (trail) TRAIL = trail.split(',');
    const key=m[2], pg=findPage(key);
    if (pg) select(key,pg,{pulse:true}).then(()=>{
      if (m[3]){                        // restore a highlighted range
        const [s,a1]=m[2].split(':').map(Number), a2=Number(m[3].split(':')[1]);
        const keys=[]; for(let a=a1;a<=a2;a++){ const k=s+':'+a; if(findPage(k)===pg) keys.push(k); }
        keys.forEach(k=>HL.highlight(k,'hlt','hlt'));
      }
    });
  }
})();
</script>
