# How this repo shows on the local launcher (~/Workspace/git/hubs).
# Check it with `uv run ~/Workspace/git/hubs/launcher/check.py --repo .`

runners:
  - id: hifth
    port: 7122                    # apps/web/vite.config.ts, strictPort
    health: /
    start: make dev               # `make pitch` and `make dev-qul` use this port too
  - id: hifth-preview
    port: 7123                    # apps/web/vite.config.ts and the Makefile's PORT, strictPort
    health: /
    start: make preview           # builds first, then serves the production bundle
  - id: hifth-comments
    comments_for: hifth           # the Comment button in front of the app on 7122
    port: 8767                    # .page-comments/config.json and the Makefile's comments target
    health: /
    start: make comments
  - id: hifth-app
    port: 7124                    # .claude/skills/deploy-site/scripts/release-hifth-app.mjs serve
    health: /
    start: make hifth-app-serve   # builds, puts the release folder together, then Cloudflare's local server

hubs:
  - id: hifth
    name: Hifth
    description: Mushaf pages for huffaz; tap a verse to jump to similar verses and shared roots. Installable on a phone.
    visibility: public
    use: published
    fallback: local
    local: { runner: hifth }
    published:
      url: https://blog.bytesofpurpose.com/hifth/
      host: github-pages          # deployed by the GitHub Actions workflow on each push to main
  - id: hifth-app
    name: hifth.app
    description: The front page that announces the Mac app and opens Hifth in the browser at /read/, with the sign-up for word when the Mac app is out.
    visibility: public
    use: local                    # not released yet; switch to published once hifth.app is live
    local: { runner: hifth-app }
  - id: hifth-docs
    name: Hifth design pages
    description: The design notes, option comparisons and review sheets behind Hifth.
    visibility: public
    use: published
    fallback: local
    local: { runner: hifth-preview, path: /docs/ }   # the build stages docs/; the dev server on 7122 does not
    published:
      url: https://blog.bytesofpurpose.com/hifth/docs/
      host: github-pages
  - id: hifth-intent
    name: What the work in Hifth is for
    description: Who each piece of work is for, from the ask to the commit. Drawn by `make intent`; served by the dev server only, never published.
    visibility: private
    use: local
    local: { runner: hifth, path: /intent/ }
  - id: hifth-dev-hub
    name: Hifth features by link
    description: One card per place, tool and panel a link can open, with a picture, a link for this browser and the command that sends it to the iPad.
    visibility: private
    use: local
    local: { runner: hifth, path: /dev-hub/ }   # written by `make feature-links`; served by the dev server only
