# THROWAWAY. This workflow answers one question and is then deleted.
#
# Question: can a GitHub runner reach qurancomplex.gov.sa at all?
#
# From the maintainer's machine it cannot, and the failure is at the TCP layer,
# not the HTTP one — DNS resolves (66.9.131.70), a browser User-Agent changes
# nothing, and `nc -z 443` times out. So this is not a bot filter that a header
# could talk its way past; the packets do not arrive. A GitHub runner sits on a
# different network in a different country, so the answer here is genuinely not
# predictable from a laptop, which is the only reason this file exists.
#
# What the answer decides (docs/research/2026-07-27-unattended-validation.md §6):
#
#   reachable   → build the terms watcher (task ⑦): a scheduled job that
#                 notices when the KFGQPC terms page changes under us.
#   unreachable → do NOT build the watcher. Record "unreachable from CI" in the
#                 `how` of the kfgqpc-terms-primary-source ledger check and
#                 leave it an honest outstanding human check. A watcher that
#                 silently fails forever is worse than no watcher: it converts a
#                 check nobody has done into a green tick that means nothing.
#
# Manual trigger only. A probe that runs on every push is a dependency on
# someone else's uptime, and this repo's CI does not take those.
name: probe · KFGQPC reachability

on:
  workflow_dispatch:

jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      # Never fails. The job's product is its printed output, and a red X here
      # would say "CI is broken" when what it actually means is "a Saudi
      # government site did not answer", which is the finding, not a fault.
      - name: curl the terms host
        run: |
          set +e
          HOST=qurancomplex.gov.sa
          URL=https://$HOST/en/

          echo "== DNS =="
          getent hosts "$HOST" || echo "(no A record)"

          echo
          echo "== TCP 443 =="
          # Distinguishes a network-layer block from an HTTP-layer refusal —
          # the same split that identified the local failure. bash's /dev/tcp
          # keeps this dependency-free.
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/443" \
            && echo "connect: OK" \
            || echo "connect: FAILED (rc=$?)"

          echo
          echo "== HTTP =="
          for ua in "curl" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -A "$ua" "$URL" 2>&1)
            echo "UA=${ua:0:12}… → $code"
          done

          echo
          echo "Read the result into task #70. 000/connect FAILED → do not build ⑦."
          exit 0
