name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The publish half of this workflow. `push` to main already deploys to GitHub
  # Pages; this is here so the *other* target can be chosen without editing a
  # workflow file in a hurry, which is when deploys go wrong. Dispatching still
  # runs every gate first — there is no path in this repo that publishes bytes
  # no gate has seen.
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish once the gates pass"
        type: choice
        options: [pages, cloudflare]
        default: pages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail the build if a secret is committed. Scans full history on push, and the
  # PR diff on pull_request. Config + allowlist live in .gitleaks.toml.
  secrets-scan:
    runs-on: ubuntu-latest
    # Narrower than the repo default, not wider. On `pull_request` the action
    # asks the API which commits the PR contains before scanning them, so a
    # token with only `contents: read` gets a 403 and the action exits rather
    # than scanning nothing — correct of it, and the reason both of these are
    # spelled out here instead of inherited.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the scan sees every commit
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required on `pull_request` since gitleaks-action v2.3 — the action
          # asks the API which commits the PR contains, and without a token it
          # refuses to scan rather than scanning nothing. The default job token
          # is enough; it needs no extra permissions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @hifth/core is consumed via its built dist/ (package exports point there),
      # so it must be compiled before anything downstream — the ETL imports it at
      # runtime (extraction check below) and apps/web typechecks/tests against it.
      - name: Build core
        run: pnpm --filter @hifth/core build

      # The extracted assets + adjacency shards are committed, but re-run the ETL
      # and fail if it is not byte-identical — the ETL must be deterministic
      # (PLAN §6). Core must be built first so build:adjacency can import it.
      - name: Verify ETL output is deterministic
        run: |
          pnpm --filter @hifth/core build
          pnpm --filter @hifth/etl extract:pages
          pnpm --filter @hifth/etl build:adjacency
          pnpm --filter @hifth/etl build:roots
          pnpm --filter @hifth/etl build:tajweed
          git diff --exit-code -- apps/web/public/assets \
            || (echo "::error::ETL output differs from committed assets" && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Corpus audit
        run: pnpm audit:corpus

      - name: Gate — no <text> in SVG assets
        run: pnpm gate:notext

      # Every ayah of rendered text traces to a declared source edition.
      - name: Gate — text sources
        run: pnpm gate:text-sources

      - name: Gate — license (SOURCES.md)
        run: pnpm gate:license

      # SOURCES.md is the record; the colophon is what the reader is actually told.
      # They once disagreed — the app credited the KFGQPC artwork as non-commercial,
      # which is a different edition's term — and nothing failed, because only one
      # of the two files was ever read by a machine. Now the record declares the
      # reader-facing row and this asserts the component renders exactly it.
      - name: Gate — the licence on screen is the licence on record
        run: pnpm gate:license-copy

      # The manual-validation ledger. This does NOT fail on outstanding checks —
      # a phone that has not been held yet is a fact, not a broken build, and a
      # permanently red gate teaches everyone to ignore it. It fails when the
      # ledger lies: a malformed entry, a "done" with no recorded result, or a
      # recurring check whose result has expired. Its log doubles as the answer
      # to "what is this project actually waiting on?".
      - name: Gate — manual-validation ledger
        run: pnpm gate:validation

      # Human verdicts about edges, enforced forever. "correct" edges must still
      # ship; "wrong" ones must stay gone. A reader with a mushaf is the scarcest
      # input this project has — this is what stops their time being spent twice.
      - name: Gate — verified edges hold
        run: pnpm gate:verified-edges

      # Meaning, cheaply: a hop edge must share a run of words with the ayah it
      # departs from. The corpus shipped off-by-one for four loops and every
      # other check stayed green, because a wrong edge is structurally perfect.
      # This gate lived in the Makefile and in no workflow — green on the
      # author's laptop, absent from the run that blocks the merge, which is the
      # worse direction of the defect gate:gates below now makes impossible.
      - name: Gate — hop edges share words with their source
        run: pnpm gate:edges

      # All three of these check the repo's own machinery, and each was written
      # after a defect that CI itself could not see — an upload step that
      # preserved nothing, a visual gate whose baselines were rendered on a
      # different machine than the one checking them, and two gates that were
      # merged and then invoked by nothing at all. The first two lived in
      # `pnpm gates` without ever being wired into a job; the third makes that
      # arrangement impossible to repeat, in all three directions. A gate nobody
      # runs is a comment.
      - name: Gate — every gate is invoked, here and in make ci
        run: pnpm gate:gates

      - name: Gate — CI artifacts have producers
        run: pnpm gate:ci-artifacts

      - name: Gate — golden baselines rendered and checked by one image
        run: pnpm gate:golden-env

      # Why the baselines are committed to git rather than Git LFS, expressed as
      # the number at which that answer should be revisited. The gate's docblock
      # carries the reasoning.
      - name: Gate — golden baselines stay small enough to commit
        run: pnpm gate:golden-size

      # The mus'haf is two orders of magnitude heavier than the JS bundle and had
      # nothing watching it. Reads public/assets, not dist — it must fail on the
      # commit that vendors a heavy page, and the pages ceiling is per-page plus a
      # 604-page projection so today's three speak about Loop 4b's whole book.
      - name: Gate — the vendored corpus stays weighable
        run: pnpm gate:assets

      # Identity and reach, over the same 604 files gate:assets weighs: every
      # page is byte-for-byte what vendor-pages.mjs produced from the pin, and
      # every glyph of scripture falls inside a polygon a finger can reach. The
      # second half is PLAN 14 and it shipped one run without this line, which is
      # the lesson — a gate that no job invokes is a script.
      - name: Gate — the pages are the pinned print, and all of it is tappable
        run: pnpm gate:pages

      # The word boxes are geometry vendored from a second print of the same
      # mus'haf and fitted onto our frame, so a hash alone would not prove much:
      # this re-measures every box against the polygon it claims, with its own
      # parser rather than the ETL's. It is the witness that found the one
      # polygon gate:pages could not see — the ink was covered, by the wrong
      # ayah — so the two run side by side rather than one standing in for both.
      - name: Gate — every word box lands on the ayah it claims
        run: pnpm gate:words

      # The map between the two word indices — the print's, which every box
      # carries, and QAC's, which the roots shards speak. It was derived from a
      # 351 MB corpus this repo does not vendor, so CI cannot re-derive it; what
      # it can do is APPLY it to the committed shards and check the result
      # against the vendored morphology, which is an independent third witness.
      # An unchecked derived artifact is what #80 was, and it cost four loops.
      - name: Gate — the print↔QAC word map still lands where QAC says
        run: pnpm gate:align

      # docs/map.json tells a newcomer where each feature starts. This checks it
      # is still true, so it cannot rot into confident fiction. The pre-commit
      # hook runs the same gate scoped to the staged files.
      - name: Gate — the code map still resolves
        run: pnpm gate:map

      # docs/use-cases.json says what we promise and names the test or gate that
      # would fail if we broke it. This checks those still exist and are still
      # tests, and that the committed docs/use-cases.md was regenerated.
      - name: Gate — every promise still has a proof
        run: pnpm gate:use-cases

      # docs/issues.json indexes every open item across PLAN.md's follow-ups,
      # backlog.md, the design docs' open-questions sections and the validation
      # ledger. This checks each entry still points at something, that its status
      # agrees with the document that owns it, that "fixed" names a test that
      # exists — and the direction the others cannot check, that no item in any
      # of those registers is missing from the index.
      - name: Gate — every open item is indexed, and the index still resolves
        run: pnpm gate:issues

      # AYAH_COUNTS, JUZ_STARTS and HIZB_STARTS are hand-typed numbers whose only
      # symptom when wrong is an ayah quietly filed under the wrong division —
      # in range, ascending, and false. This re-derives all three from the
      # vendored Tanzil metadata and diffs them.
      - name: Gate — the structural tables match their source
        run: pnpm gate:quran-meta

      # The revision record is a log of when a person was reading Qur'an. This
      # checks the closed allow-list of modules allowed to import it is still
      # closed, and that its own modules still hold no way off the device.
      - name: Gate — the revision record never leaves the device
        run: pnpm gate:revision-privacy

      # `tsc` already refuses a locale that is missing a key — every compiled
      # catalog is declared `const messages: Catalog`, and there is no runtime
      # lookup that could fall back to another language. This covers the four
      # things it cannot see: generated code left stale after a catalog edit, a
      # key the reference locale has and a translation does not, a plural that
      # writes four of Arabic's six categories, and a translation that drops a
      # placeholder. See docs/design/i18n.md §④.
      - name: Gate — every locale is complete, and its plurals are its own
        run: pnpm gate:i18n

      # The URL is this app's entire state — there is no server and no session
      # store — so the query grammar is a public interface, and "what happens
      # when this value is wrong" is part of it. This binds parseHash,
      # serializeState and docs/query-params.md to each other, including the
      # failure-mode column, and keeps the five fields in step across core, the
      # stylesheet and the catalog.
      - name: Gate — the link grammar matches its catalog
        run: pnpm gate:params

      - name: Build
        run: pnpm build

      - name: Gate — JS budget (<150KB gz)
        run: pnpm gate:budget

      # Deliberately the last step, and deliberately an upload rather than a
      # rebuild in the deploy job: what gets published is then *these* bytes —
      # the ones the budget gate just weighed and the ETL determinism check just
      # proved match the committed assets. A deploy job that runs `pnpm build`
      # again publishes a bundle no gate ever looked at. Same reasoning as the
      # golden-env gate one level down: rendering in one place and checking in
      # another is a coin flip with a version number on it.
      #
      # It also uploads on pull_request, where nothing deploys. That is on
      # purpose — it is how a reviewer downloads the exact artifact a merge
      # would publish, and it means the upload path is exercised on every PR
      # instead of first being tried on the day it matters.
      - name: Upload the built site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    # The pinned Playwright image, and not a bare runner with
    # `playwright install --with-deps`. Those are not the same machine, and the
    # first CI run of this tier proved it in two ways at once:
    #
    #   - all ten golden diffs failed at 5–11% of pixels — orders of magnitude
    #     past the 0.5% anti-aliasing tolerance — while the same commit passed
    #     10/10 inside this image via `make golden-linux`;
    #   - two Android taps timed out because a footer control and a jumper
    #     option were physically covered by their neighbours.
    #
    # One cause fits both. `--with-deps` installs the browser's shared
    # libraries; it does not install fonts. Arabic then falls back to whatever
    # the runner happens to have, every label measures a different width, the
    # 430px-intrinsic chrome (#63) overlaps a few pixels sooner, and the SVG
    # lays out at a slightly different size — so every glyph edge in the golden
    # shots lands on a different pixel. A gate that renders its baselines in one
    # environment and checks them in another is a coin flip with a version
    # number on it.
    #
    # This image is the one `make golden-linux` uses and the one
    # e2e/__screenshots__/linux was rendered in; scripts/gate-golden-env.mjs
    # fails the build if the two ever drift apart. Browsers are already baked
    # in, so the install step is gone with it.
    #
    # `--user 1001` is Playwright's documented recipe for container jobs: the
    # runner's workspace is owned by uid 1001, and Chromium will not start its
    # sandbox as root.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      # The image ships Node and corepack but no pnpm, and pnpm/action-setup
      # wants a Node action runtime this container does not need to provide.
      # Corepack pins the same version as every other job.
      #
      # --install-directory is not optional here: bare `corepack enable`
      # symlinks into /usr/bin, and this job runs as uid 1001 (see above), so it
      # dies with EACCES before installing anything. Point it at a writable dir
      # and put that on PATH for the steps that follow.
      - name: Enable pnpm
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" corepack prepare pnpm@9.15.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build core
        run: pnpm --filter @hifth/core build
      - name: Build web
        run: pnpm --filter @hifth/web build
      # Also runs the `golden` project: the visual gate diffs pages 7/9/19 in
      # every highlight state against the committed linux baselines
      # (apps/web/e2e/__screenshots__/linux, refreshed with `make golden-linux`).
      #
      # The preview server starts inside this container, so the browser reaches
      # the app on http://localhost:4173 — a secure context, which is what lets
      # the service worker register at all. Reaching a host-side server over
      # host.docker.internal does not, and the offline/SW specs fail there for a
      # reason that has nothing to do with the app.
      - name: E2E (mobile viewports + golden images)
        run: pnpm --filter @hifth/web test:e2e

      # A failed golden diff is three images and a timeline; neither reads as log
      # output. The html reporter bundles them — the expected/actual/diff
      # triptych, the failing screenshot, and the retry's trace — into one folder
      # that opens offline once downloaded and unzipped:
      #
      #   gh run download <run-id> -n playwright-report && open index.html
      #
      # `always()`, not `failure()`: a green run's report is how a flake is
      # caught (it lists the tests that only passed on retry), and that is
      # invisible from a green check mark. This upload used to be `failure()`
      # only and pointed at a directory the CI reporter never created, so the
      # traces were discarded on exactly the runs that needed them. That is what
      # `if-no-files-found: error` is for: an upload step that silently uploads
      # nothing is indistinguishable from one that works, for as long as nobody
      # needs it.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: error

  # Lighthouse gate: all four categories ≥90 (PLAN §Loop 6a exit criterion).
  #
  # Its own job, deliberately, rather than a step inside build-test-gate or a
  # `make ci` line:
  #   - it needs Chrome and ~90s of runs (3 runs, median) — that is dead weight
  #     bolted onto the gate everyone waits on, and it parallelises for free;
  #   - `make ci` is documented as an exact mirror of build-test-gate, and it
  #     should stay exactly that.
  # It still runs on EVERY push and pull_request, at full strength: the
  # threshold is not weakened anywhere, only moved to where it is stable.
  # Reproduce locally with `make lighthouse`.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm --filter @hifth/core build
          pnpm --filter @hifth/web build
      # Config (URLs, run count, the ≥90 assertions) lives in .lighthouserc.json.
      # ubuntu-latest ships Chrome, so lhci finds a browser without help.
      - name: Lighthouse CI (categories ≥90)
        run: pnpm dlx @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: error
          # lhci writes to a dot-directory, and upload-artifact has excluded
          # hidden files by default since v4 — so this upload found nothing and,
          # thanks to `if-no-files-found: error`, failed the job even though the
          # ≥90 assertions had all passed. Exactly the failure mode that setting
          # exists to surface, caught by it on the first run.
          # scripts/gate-ci-artifacts.mjs now requires this line on any path
          # starting with a dot.
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Publish.
  #
  # GitHub Pages is the default and the only automatic one: every push to main
  # that clears all four gates is served at https://blog.bytesofpurpose.com/hifth/.
  # Cloudflare Pages is kept as a live alternative — not a commented-out
  # aspiration — because the choice of host is the kind of decision that gets
  # revisited, and rediscovering how to publish under pressure is how a wrong
  # bundle goes out.
  #
  # Both publish the SAME artifact, downloaded rather than rebuilt, so the two
  # paths cannot drift on anything except the last step. The alternative that
  # rots is the one whose build is a second, unexercised copy of the first.
  #
  # Neither job needed a single change to the app: `base: "./"`, `start_url` and
  # `scope` of `"./"`, and hash routing mean the bundle is already indifferent
  # to whether it is served from a domain root or a `/hifth/` subpath. The one
  # thing GitHub Pages does not honour is public/_headers — see the note there.
  # ---------------------------------------------------------------------------

  deploy-pages:
    needs: [secrets-scan, build-test-gate, e2e, lighthouse]
    # `needs` on all four is the whole safety argument: this job is unreachable
    # unless the secret scan, the gates, the e2e/golden suite and Lighthouse all
    # passed on these exact bytes. Restricted to main in both cases — dispatching
    # from a branch runs the gates and publishes nothing, because "what is
    # deployed" should only ever be answerable by looking at main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pages'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # The lesson gate:ci-artifacts was written for, pointed the other way: an
      # upload of nothing looks exactly like one that worked. So does a download
      # of nothing — and unlike a lost test report, this one would go live, as a
      # perfectly successful deploy of an empty directory over a working site.
      - name: The artifact must actually contain a site
        run: |
          test -s site/index.html || {
            echo "::error::downloaded artifact has no index.html — refusing to publish an empty site"
            exit 1
          }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: [secrets-scan, build-test-gate, e2e, lighthouse]
    # Never automatic. Choosing it is the point.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.target == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      # Only for apps/web/wrangler.toml — the project name and output dir live
      # there, so this runs the same command the file documents for a laptop
      # (`make deploy-cloudflare`) rather than a second spelling of it.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: apps/web/dist

      - name: The artifact must actually contain a site
        run: |
          test -s apps/web/dist/index.html || {
            echo "::error::downloaded artifact has no index.html — refusing to publish an empty site"
            exit 1
          }

      # Read through env, never interpolated into the command line: `${{ secrets.X }}`
      # in a `run:` is substituted into the script before the shell sees it, so a
      # trace, a set -x, or an error message can echo the token back. This also
      # turns the most likely failure — an alternative path chosen years later on
      # a repo whose secrets were never set — into one legible line instead of a
      # wrangler stack trace.
      - name: Cloudflare credentials must be present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$missing" ] || {
            echo "::error::this repo has no$missing — add them under Settings › Secrets › Actions"
            exit 1
          }

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name hifth
