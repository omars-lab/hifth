<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping browser zoom is a WCAG 1.4.4 failure (and a
         Lighthouse a11y failure), and it buys nothing here — the mushaf stage
         sets `touch-action: none`, so its own pan/zoom already owns every
         gesture over the page. Pinch outside the stage is the reader's, and on
         chrome that small it is the one they are most likely to want. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="حفظ — ملاحة للحُفّاظ. A navigation instrument for huffaz." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hifth" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>حفظ · Hifth</title>
  </head>
  <body class="skin-plain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
